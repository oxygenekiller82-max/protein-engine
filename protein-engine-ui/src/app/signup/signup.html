<link rel="stylesheet" href="signup.css">
<div class="page-wrapper">

  <nav>
    <div class="logo">Protein Engine</div>
    <ul>
      <li><a routerLink="/home">Home</a></li>
      <li><a routerLink="/about">About</a></li>
      <li><a routerLink="/logs">Logs</a></li>
      <li><a routerLink="/compare">Compare</a></li>
      <li><a routerLink="/signup" class="active">Sign Up</a></li>
    </ul>
    <div class="nav-icons">
      <span class="search"></span>
      <span class="menu"></span>
    </div>
  </nav>

  <div class="inner-frame">

    <div class="form-container">
      <h2>Sign Up</h2>
      <div class="form">
        <input type="text" placeholder="First Name" [(ngModel)]="user.firstName" name="firstName">
        <input type="text" placeholder="Last Name"  [(ngModel)]="user.lastName"  name="lastName">
        <input type="email" placeholder="Email"     [(ngModel)]="user.email"     name="email">
        <input type="password" placeholder="Password" minlength="6" [(ngModel)]="user.password" name="password">
        <input type="password" placeholder="Confirm Password" [(ngModel)]="confirmPassword" name="confirmPassword">
        <button (click)="register()">Register</button>
      </div>

      <p *ngIf="message" class="error-msg">{{ message }}</p>

      <p class="signup-text">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </div>

    <div class="image-container">
      <img src="1000016544.jpg" alt="image">
    </div>

  </div>

</div>
